<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klaim Promo - Brew93coffee</title>
    <!-- Menggunakan Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Menggunakan FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Menggunakan Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animasi Background untuk konsistensi tema */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        /* Glass Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Animasi Masuk (Fade in) */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="bg-blue-950 text-white min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-amber-500 selection:text-white">

    <!-- Background Elements -->
    <div class="absolute top-0 left-[-10%] w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-0 right-[-10%] w-64 h-64 bg-slate-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-64 h-64 bg-amber-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>

    <!-- Main Content -->
    <main class="glass-card w-full max-w-md rounded-2xl p-6 md:p-8 relative z-10 text-center animate-fade-in-up">
        
        <!-- Logo & Header -->
        <div class="mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-white/5 mb-3 ring-2 ring-amber-500/50 overflow-hidden shadow-[0_0_15px_rgba(245,158,11,0.3)]">
                <img src="https://raw.githubusercontent.com/gerryramdani-star/brew93coffee/refs/heads/main/asset/logobrew%2093.jpg" alt="Logo Brew93coffee" class="w-full h-full object-cover">
            </div>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">
                Voucher Spesial!
            </h1>
            <p class="text-amber-400 text-xs md:text-sm font-medium mt-1">
                Diskon 20% Khusus Weekend
            </p>
        </div>

        <!-- Banner Image Placeholder -->
        <!-- Ganti URL src di bawah dengan link gambar banner promo Anda yang sebenarnya -->
        <div class="rounded-xl overflow-hidden mb-6 shadow-2xl border border-white/10 relative group">
            <img src="https://raw.githubusercontent.com/gerryramdani-star/brew93coffee/refs/heads/main/asset/voucher-diskon-20.jpg" alt="Banner Promo Diskon 20%" class="w-full h-auto object-cover aspect-[4/5] sm:aspect-square transition-transform duration-500 group-hover:scale-105">
        </div>

        <!-- Instruksi Area (Highlighted) -->
        <div class="bg-amber-500/10 border border-amber-500/40 rounded-xl p-4 md:p-5 mb-6 relative overflow-hidden">
            <!-- Efek Glow di dalam boks instruksi -->
            <div class="absolute -top-10 -right-10 w-20 h-20 bg-amber-500/20 blur-2xl rounded-full"></div>
            
            <i class="fa-solid fa-mobile-screen-button text-amber-400 text-3xl mb-3 animate-bounce"></i>
            <p class="text-amber-50 font-medium text-sm md:text-base leading-relaxed">
                Screenshoot Gambar ini dan tunjukkan di kasir untuk klaim promonya!
            </p>
        </div>

        <!-- Tombol Kembali -->
        <!-- Ganti index.html dengan nama file utama Anda (misal borneo_electronic_plus.html) -->
        <a href="index.html" class="inline-flex items-center justify-center gap-2 text-sm text-slate-400 hover:text-white transition-colors py-2 px-4 rounded-lg hover:bg-white/5">
            <i class="fa-solid fa-arrow-left-long"></i>
            <span>Kembali ke Menu Utama</span>
        </a>

    </main>

    <!-- Footer Simple -->
    <div class="absolute bottom-4 left-0 w-full text-center z-0">
        <p class="text-[10px] text-slate-500/50 uppercase tracking-widest">2026 brew93coffee</p>
    </div>

</body>
</html>
