    <title>Brew93coffee</title>
    <!-- Menggunakan Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Menggunakan FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Menggunakan Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Menghilangkan highlight biru saat tap di Android/iOS */
        }

        /* Animasi Background */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }

        /* Glass Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:active {
            transform: scale(0.98); /* Efek tekan halus di HP */
            background: rgba(255, 255, 255, 0.1);
        }

        @media (hover: hover) {
            .glass-btn:hover {
                background: rgba(255, 255, 255, 0.15);
                border-color: rgba(255, 255, 255, 0.2);
                transform: translateY(-2px);
                box-shadow: 0 10px 20px -10px rgba(0,0,0,0.5);
            }
        }

        /* Animasi Promo (Perhatian) */
        @keyframes promo-shine {
            0% { transform: translateX(-150%) skewX(-15deg); }
            20%, 100% { transform: translateX(250%) skewX(-15deg); }
        }
        .animate-promo-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 30%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 100%);
            animation: promo-shine 3s infinite;
            z-index: 20;
            pointer-events: none;
        }
        
        @keyframes promo-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 0 rgba(245, 158, 11, 0); border-color: rgba(245, 158, 11, 0.2); }
            50% { transform: scale(1.02); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(245, 158, 11, 0.4); border-color: rgba(245, 158, 11, 0.7); }
        }
        .animate-promo-pulse {
            animation: promo-pulse 2.5s infinite ease-in-out;
        }
    </style>

    src="https://www.facebook.com/tr?id=YOUR_PIXEL_ID_HERE&ev=PageView&noscript=1"

<body class="bg-blue-950 text-white min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-blue-600 selection:text-white">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Background Elements -->
    <div class="absolute top-0 left-[-10%] w-64 h-64 md:w-72 md:h-72 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-0 right-[-10%] w-64 h-64 md:w-72 md:h-72 bg-slate-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-64 h-64 md:w-72 md:h-72 bg-blue-800 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-4000"></div>

    <!-- Main Card Container -->
    <!-- PERBAIKAN: Mengubah padding p-8 menjadi p-6 (mobile) dan md:p-8 (desktop) -->
    <main class="glass-card w-full max-w-md rounded-2xl p-6 md:p-8 relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-6 md:mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 md:w-16 md:h-16 rounded-full bg-blue-600/10 mb-4 ring-2 ring-blue-500/50 shadow-[0_0_15px_rgba(37,99,235,0.3)] overflow-hidden">
                 <!-- Contoh Placeholder Gambar jika user ingin mengganti ikon dengan gambar -->
                 <!-- <img src="URL_FOTO" class="w-full h-full object-cover"> -->
                <img src="https://raw.githubusercontent.com/gerryramdani-star/brew93coffee/refs/heads/main/asset/logobrew%2093.jpg" class="w-full h-full object-cover">
            </div>
            <!-- PERBAIKAN: Font size responsif text-2xl di HP, text-3xl di Desktop -->
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight mb-2 text-white">
                Brew93coffee
            </h1>
            <p class="text-slate-300 text-xs md:text-sm font-light px-4">
                Coffee Shop (Bites & Brews)
            </p>
        </div>

        <!-- Tombol List -->
        <div class="space-y-3 md:space-y-4">
            
            <!-- Tombol 1: Promo -->
            <a href="brew93promo.html" onclick="fbq('trackCustom', 'ClaimPromo');" class="glass-btn block w-full rounded-xl p-3.5 md:p-4 group no-underline text-white relative overflow-hidden animate-promo-pulse animate-promo-shine">
                <!-- Efek cahaya tambahan untuk promo -->
                <div class="absolute inset-0 bg-gradient-to-r from-amber-500/10 to-orange-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="flex items-center justify-between relative z-10">
                    <div class="flex items-center gap-3 md:gap-4 min-w-0 flex-1">
                        <div class="w-10 h-10 rounded-lg bg-amber-500/20 flex-shrink-0 flex items-center justify-center text-amber-400 group-hover:bg-amber-500 group-hover:text-white transition-colors duration-300 border border-amber-500/30 shadow-[0_0_10px_rgba(245,158,11,0.2)]">
                            <i class="fa-solid fa-ticket-simple text-lg"></i>
                        </div>
                        <div class="text-left min-w-0 flex-1 pr-2">
                            <h3 class="font-semibold text-sm text-amber-300">Klaim Promo: Dapatkan diskon 20%</h3>
                            <p class="text-[10px] sm:text-xs text-gray-400 group-hover:text-gray-200 transition-colors mt-0.5 leading-snug">*Voucher diskon berlaku hanya weekend sampai dengan akhir juli 2026</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-gray-600 group-hover:text-amber-400 transform group-hover:translate-x-1 transition-all flex-shrink-0"></i>
                </div>
            </a>

            <!-- Tombol 2: WhatsApp -->
            <a href="https://wa.me/628212225593?text=Halo%20kak,%20ada%20promo%20apa%20hari%20ini?%20saya%20tertarik%20untuk%20pesan" target="_blank" onclick="fbq('track', 'Contact');" class="glass-btn block w-full rounded-xl p-3.5 md:p-4 group no-underline text-white">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 md:gap-4 min-w-0 flex-1"> <!-- min-w-0 mencegah flex item overflow -->
                        <div class="w-10 h-10 rounded-lg bg-green-500/20 flex-shrink-0 flex items-center justify-center text-green-400 group-hover:bg-green-500 group-hover:text-white transition-colors duration-300">
                            <i class="fa-brands fa-whatsapp text-xl"></i>
                        </div>
                        <div class="text-left min-w-0 flex-1 pr-2">
                            <h3 class="font-semibold text-sm truncate">WhatsApp Admin</h3>
                            <p class="text-xs text-gray-500 group-hover:text-gray-300 transition-colors truncate">Hubungi kami via pesan instan</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-gray-600 group-hover:text-white transform group-hover:translate-x-1 transition-all flex-shrink-0"></i>
                </div>
            </a>

            <!-- Tombol 3: Google Maps -->
            <a href="https://maps.app.goo.gl/7BJPcfCZsvS3qY4y6" target="_blank" onclick="fbq('trackCustom', 'ClickMaps');" class="glass-btn block w-full rounded-xl p-3.5 md:p-4 group no-underline text-white">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3 md:gap-4 min-w-0 flex-1">
                        <div class="w-10 h-10 rounded-lg bg-red-500/20 flex-shrink-0 flex items-center justify-center text-red-400 group-hover:bg-red-500 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <div class="text-left min-w-0 flex-1 pr-2">
                            <h3 class="font-semibold text-sm truncate">Lokasi Coffee Shop</h3>
                            <p class="text-xs text-gray-500 group-hover:text-gray-300 transition-colors truncate">Lihat rute di Google Maps</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-gray-600 group-hover:text-white transform group-hover:translate-x-1 transition-all flex-shrink-0"></i>
                </div>
            </a>

        </div>

        <!-- Footer -->
        <div class="mt-8 text-center">
            <p class="text-[10px] text-slate-400 uppercase tracking-widest">2026 brew93coffee. All rights reserved.</p>
        </div>

    </main>

    <script>
        console.log("Halaman Responsive Mobile Siap");
    </script>
